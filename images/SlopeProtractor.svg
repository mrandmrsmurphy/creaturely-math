<text x="450.0" y="90" font-size="15" fill="#b4472b" text-anchor="middle">top edge: slope m = 60/d  (d = marks from the left corner)</text>
<text x="90" y="962" font-size="15" fill="#1b1b1b"><tspan font-weight="bold">Reading.</tspan> If the line leaves through the right edge, m = j/60 (every 6 marks is 0.1).</text>
<text x="90" y="984" font-size="15" fill="#1b1b1b">If it leaves through the top edge, m = 60/d: the marks are even in 1/m, so the slopes are not.</text>
<text x="90" y="1006" font-size="15" fill="#1b1b1b">The left corner of the top edge (d = 0) is the vertical, slope ∞. Each reading is an exact rational.</text>
