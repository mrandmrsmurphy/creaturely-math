<text x="450.0" y="42" text-anchor="middle" font-size="28" font-weight="bold" fill="#1b1b1b">Slope protractor</text>
<text x="450.0" y="70" text-anchor="middle" font-size="15" fill="#8a8a8a">lay the object along a ray from the corner O; read the slope where the ray leaves the square</text>
