<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1040" width="900" height="1040" font-family="Helvetica, Arial, sans-serif">
<title>Slope protractor</title>
<desc>A square of side 1 divided into 60 marks on each of the right and top edges. A line laid along a ray from the lower-left corner reads its slope m on the right edge as j/60 when m is at most 1, or on the top edge as 60/d when m is at least 1.</desc>
