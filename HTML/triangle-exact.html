<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constructible Trigonometry: Triangle Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EEF2F1;
  --panel: #F8FAF9;
  --ink: #1D2A44;
  --muted: #5B6779;
  --rule: #CBD5D6;
  --grid-minor: #DCE5E4;
  --grid-major: #B9C8C8;
  --axis: #1D2A44;
  --tri-fill: rgba(29, 42, 68, 0.07);
  --ptA: #B3364A;
  --ptB: #1F7A72;
  --ptC: #A8741A;
  --circum: #4A5BB5;
  --incircle: #3E8E4E;
  --warn: #9A3B1F;
  --input-bg: #FFFFFF;
  --focus: #4A5BB5;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161C26; --panel: #1C2330; --ink: #E3E8EF; --muted: #98A3B3;
    --rule: #2E3847; --grid-minor: #212A37; --grid-major: #313D4F; --axis: #C9D2DE;
    --tri-fill: rgba(227, 232, 239, 0.06);
    --ptA: #E8798A; --ptB: #5CC2B7; --ptC: #E2B25A;
    --circum: #8D9CF0; --incircle: #7DCB8B; --warn: #F08F6E;
    --input-bg: #121821; --focus: #8D9CF0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #161C26; --panel: #1C2330; --ink: #E3E8EF; --muted: #98A3B3;
  --rule: #2E3847; --grid-minor: #212A37; --grid-major: #313D4F; --axis: #C9D2DE;
  --tri-fill: rgba(227, 232, 239, 0.06);
  --ptA: #E8798A; --ptB: #5CC2B7; --ptC: #E2B25A;
  --circum: #8D9CF0; --incircle: #7DCB8B; --warn: #F08F6E;
  --input-bg: #121821; --focus: #8D9CF0;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%;
  background: var(--paper); color: var(--ink);
  font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  font-size: 15px; line-height: 1.4;
}
.app { display: grid; grid-template-columns: minmax(330px, 400px) 1fr; height: 100%; }
aside {
  background: var(--panel); border-right: 1px solid var(--rule);
  overflow-y: auto; padding: 22px 22px 28px;
}
h1 {
  font-family: "EB Garamond", Garamond, "Times New Roman", serif;
  font-weight: 500; font-size: 1.75rem; line-height: 1.1; margin: 0 0 4px;
}
.sub { color: var(--muted); margin: 0 0 18px; font-size: 0.93rem; }
h2 {
  font-family: "EB Garamond", Garamond, serif; font-style: italic; font-weight: 400;
  font-size: 1.15rem; margin: 20px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--rule);
}
.pts { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px 8px; align-items: center; }
.pts .lbl { font-family: "EB Garamond", serif; font-size: 1.25rem; font-weight: 600; width: 1.6em; }
.pts input {
  width: 100%; min-width: 0; font: inherit; font-size: 1rem; padding: 6px 8px;
  border: 1px solid var(--rule); border-radius: 4px; background: var(--input-bg); color: var(--ink);
}
.pts input.bad { border-color: var(--warn); }
.pts .colhead { font-size: 0.8rem; color: var(--muted); text-align: center; }
input:focus-visible, select:focus-visible, button:focus-visible, label:focus-within {
  outline: 2px solid var(--focus); outline-offset: 1px;
}
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; align-items: center; font-size: 0.9rem; }
select, button {
  font: inherit; font-size: 0.9rem; padding: 5px 8px; border-radius: 4px;
  border: 1px solid var(--rule); background: var(--input-bg); color: var(--ink); cursor: pointer;
}
.toggles label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.hint { font-size: 0.82rem; color: var(--muted); margin-top: 8px; }

/* Results */
.res { display: grid; grid-template-columns: auto 1fr; gap: 9px 12px; align-items: baseline; }
.res .name { font-family: "EB Garamond", serif; font-style: italic; font-size: 1.1rem; white-space: nowrap; }
.res .name sub { font-style: normal; font-size: 0.7em; }
.val { font-family: "EB Garamond", Garamond, serif; font-size: 1.3rem; line-height: 1.5; overflow-x: auto; }
.val .approx { font-family: "Source Sans 3", sans-serif; font-size: 0.8rem; color: var(--muted); margin-left: 10px; white-space: nowrap; }
.val.na { color: var(--muted); font-size: 1rem; font-style: italic; }
.note { margin-top: 14px; font-size: 0.9rem; color: var(--muted); }
.note.warn { color: var(--warn); }

/* Math typesetting */
.m { display: inline-flex; align-items: center; white-space: nowrap; }
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 2px; font-size: 0.92em; line-height: 1.15; }
.frac > span { padding: 0 3px; }
.frac > span:first-child { border-bottom: 1px solid currentColor; }
.rad { display: inline-flex; align-items: flex-end; }
.rad .sign { font-size: 1.05em; line-height: 1; margin-right: -1px; }
.rad .under { border-top: 1px solid currentColor; padding: 0 2px 0 1px; line-height: 1.05; }
.op { margin: 0 0.25em; }

.stage { position: relative; min-height: 0; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.zoom { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 36px; height: 36px; font-size: 1.15rem; padding: 0; background: var(--panel); }
.zoom button.fit { font-size: 0.72rem; }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 5px 9px; font-size: 0.8rem; color: var(--muted); }
.ptA { color: var(--ptA); } .ptB { color: var(--ptB); } .ptC { color: var(--ptC); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; }
  .stage { order: -1; height: 58vh; }
  aside { border-right: none; border-top: 1px solid var(--rule); }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Triangle Explorer</h1>
    <p class="sub">Exact values only: integers, fractions, and simplified radicals.</p>

    <h2>Vertices</h2>
    <div class="pts" id="ptInputs">
      <span></span><span class="colhead">x</span><span class="colhead">y</span>
    </div>
    <div class="controls">
      <label>Snap to
        <select id="snap">
          <option value="1">integers</option>
          <option value="2">halves</option>
          <option value="4">quarters</option>
        </select>
      </label>
      <label>Example
        <select id="preset">
          <option value="">choose…</option>
          <option value="0,0;4,0;0,3">3–4–5 right triangle</option>
          <option value="0,0;4,0;2,4">Isosceles</option>
          <option value="0,0;1,0;0,1">Right isosceles</option>
          <option value="-2,-1;3,1;1,4">Scalene with radicals</option>
          <option value="-3,0;4,0;-5,2">Obtuse</option>
        </select>
      </label>
    </div>
    <div class="controls toggles">
      <label><input type="checkbox" id="showCirc" checked> Circumcircle</label>
      <label><input type="checkbox" id="showIn" checked> Incircle</label>
    </div>
    <p class="hint">Type integers, fractions like 3/2, or decimals. Drag the vertices on the grid; drag empty space to pan; scroll or pinch to zoom.</p>

    <h2>Sides</h2>
    <div class="res" id="sides"></div>
    <h2>Slopes</h2>
    <div class="res" id="slopes"></div>
    <h2>Measures</h2>
    <div class="res" id="measures"></div>
    <h2>Centers</h2>
    <div class="res" id="centers"></div>
    <div class="note" id="note"></div>
  </aside>

  <div class="stage">
    <canvas id="cv" aria-label="Coordinate grid with triangle ABC"></canvas>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" class="fit" aria-label="Fit triangle in view">fit</button>
    </div>
    <div class="legend"><span style="color:var(--circum)">- - -</span> circumcircle &nbsp; <span style="color:var(--incircle)">—</span> incircle</div>
  </div>
</div>

<script>
"use strict";
/* ================= Exact arithmetic ================= */
const absB = a => a < 0n ? -a : a;
function gcd(a, b) { a = absB(a); b = absB(b); while (b) { [a, b] = [b, a % b]; } return a; }
function lcm(a, b) { return a / gcd(a, b) * b; }

class Q {
  constructor(n, d = 1n) {
    if (d === 0n) throw new Error("division by zero");
    if (d < 0n) { n = -n; d = -d; }
    const g = gcd(n, d) || 1n;
    this.n = n / g; this.d = d / g;
  }
  add(o) { return new Q(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { return new Q(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { return new Q(this.n * o.n, this.d * o.d); }
  div(o) { return new Q(this.n * o.d, this.d * o.n); }
  neg() { return new Q(-this.n, this.d); }
  abs() { return new Q(absB(this.n), this.d); }
  isZero() { return this.n === 0n; }
  num() { return Number(this.n) / Number(this.d); }
}
const q = (n, d = 1) => new Q(BigInt(n), BigInt(d));

function parseQ(str) {
  str = str.trim().replace(/−/g, "-");
  let m;
  if ((m = str.match(/^([+-]?\d+)$/))) return new Q(BigInt(m[1]));
  if ((m = str.match(/^([+-]?\d+)\s*\/\s*(\d+)$/))) { if (BigInt(m[2]) === 0n) return null; return new Q(BigInt(m[1]), BigInt(m[2])); }
  if ((m = str.match(/^([+-]?)(\d*)\.(\d+)$/))) {
    const den = 10n ** BigInt(m[3].length);
    let n = BigInt((m[2] || "0") + m[3]);
    if (m[1] === "-") n = -n;
    return new Q(n, den);
  }
  return null;
}

// n = k^2 * m with m squarefree
function squarefree(n) {
  let k = 1n, m = 1n, x = n;
  for (let p = 2n; p * p <= x; p += (p === 2n ? 1n : 2n)) {
    let c = 0;
    while (x % p === 0n) { x /= p; c++; }
    if (c) { k *= p ** BigInt(c >> 1); if (c & 1) m *= p; }
  }
  return [k, m * x];
}
function smallestPrime(n) {
  for (let p = 2n; p * p <= n; p += (p === 2n ? 1n : 2n)) if (n % p === 0n) return p;
  return n;
}

/* Surd: a rational linear combination of square roots of squarefree integers.
   Stored as Map<radicand string, Q>. Radicand "1" is the rational part. */
function clean(s) { const o = new Map(); for (const [k, v] of s) if (!v.isZero()) o.set(k, v); return o; }
function addTerm(s, r, c) { const k = r.toString(); s.set(k, s.has(k) ? s.get(k).add(c) : c); }
function sQ(c) { const s = new Map(); addTerm(s, 1n, c); return clean(s); }
function sSqrt(c) { // sqrt of a nonnegative rational
  if (c.isZero()) return new Map();
  const [k, m] = squarefree(c.n * c.d);
  const s = new Map(); addTerm(s, m, new Q(k, c.d)); return s;
}
function sAdd(a, b) { const s = new Map(a); for (const [k, v] of b) addTerm(s, BigInt(k), v); return clean(s); }
function sScale(a, c) { const s = new Map(); for (const [k, v] of a) s.set(k, v.mul(c)); return clean(s); }
function sMul(a, b) {
  const s = new Map();
  for (const [k1, v1] of a) for (const [k2, v2] of b) {
    const p = BigInt(k1), r = BigInt(k2), g = gcd(p, r);
    addTerm(s, (p / g) * (r / g), v1.mul(v2).mul(new Q(g)));
  }
  return clean(s);
}
function sInv(a) {
  a = clean(a);
  if (a.size === 0) throw new Error("inverse of zero");
  const rads = [...a.keys()].map(BigInt).filter(r => r > 1n);
  if (!rads.length) return sQ(new Q(1n).div(a.get("1")));
  const p = smallestPrime(rads[0]);
  const conj = new Map();
  for (const [k, v] of a) conj.set(k, BigInt(k) % p === 0n ? v.neg() : v);
  return sMul(conj, sInv(sMul(a, conj)));   // (U+V√p)(U−V√p) has no √p
}
function sNum(a) { let t = 0; for (const [k, v] of a) t += v.num() * Math.sqrt(Number(k)); return t; }

/* ================= Typesetting ================= */
const rad = r => `<span class="rad"><span class="sign">√</span><span class="under">${r}</span></span>`;
const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const MINUS = "−";

function fmtSurd(s) {
  s = clean(s);
  if (s.size === 0) return `<span class="m">0</span>`;
  const terms = [...s.entries()].map(([k, v]) => [BigInt(k), v]).sort((x, y) => (x[0] < y[0] ? -1 : 1));
  let L = 1n; for (const [, v] of terms) L = lcm(L, v.d);
  let ints = terms.map(([r, v]) => [r, v.n * (L / v.d)]);
  const allNeg = ints.every(t => t[1] < 0n);
  if (allNeg) ints = ints.map(([r, c]) => [r, -c]);
  ints = [...ints.filter(t => t[1] > 0n), ...ints.filter(t => t[1] < 0n)]; // lead with a positive term
  // pull out a common integer factor so numerator and denominator are in lowest terms
  let g = 0n; for (const [, c] of ints) g = gcd(g, c);
  const gg = gcd(g, L);
  if (gg > 1n) { ints = ints.map(([r, c]) => [r, c / gg]); L /= gg; }
  let num = "";
  ints.forEach(([r, c], i) => {
    const neg = c < 0n, ac = absB(c);
    const body = r === 1n ? ac.toString() : (ac === 1n ? "" : ac.toString()) + rad(r);
    if (i === 0) num += (neg ? MINUS : "") + body;
    else num += `<span class="op">${neg ? MINUS : "+"}</span>` + body;
  });
  const core = L === 1n ? num : frac(num, L.toString());
  return `<span class="m">${allNeg ? MINUS : ""}${core}</span>`;
}
const fmtQ = c => fmtSurd(sQ(c));
const approx = x => `<span class="approx">≈ ${Number.isFinite(x) ? +x.toFixed(4) : "—"}</span>`;
function fmtPoint(xs, ys) {
  return `<span class="m">(${fmtSurd(xs)},&nbsp;${fmtSurd(ys)})</span>`;
}

/* ================= State ================= */
const NAMES = ["A", "B", "C"];
let pts = [{ x: q(-2), y: q(-1) }, { x: q(3), y: q(1) }, { x: q(1), y: q(4) }];
let view = { cx: 0.5, cy: 1.5, scale: 50 };   // world center, px per unit
let geom = null;   // numeric data for drawing

/* ================= Inputs ================= */
const ptBox = document.getElementById("ptInputs");
const inputs = [];
NAMES.forEach((n, i) => {
  const l = document.createElement("span");
  l.className = "lbl pt" + n; l.textContent = n;
  const ix = document.createElement("input"), iy = document.createElement("input");
  for (const [inp, ax] of [[ix, "x"], [iy, "y"]]) {
    inp.inputMode = "text"; inp.autocomplete = "off"; inp.spellcheck = false;
    inp.setAttribute("aria-label", `${n} ${ax}-coordinate`);
    inp.addEventListener("input", () => {
      const v = parseQ(inp.value);
      inp.classList.toggle("bad", !v);
      if (v) { pts[i][ax] = v; update(); }
    });
    inp.addEventListener("blur", () => syncInputs());
  }
  ptBox.append(l, ix, iy);
  inputs.push([ix, iy]);
});
function qText(c) { return c.d === 1n ? c.n.toString() : `${c.n}/${c.d}`; }
function syncInputs(except) {
  inputs.forEach(([ix, iy], i) => {
    if (ix !== except) { ix.value = qText(pts[i].x); ix.classList.remove("bad"); }
    if (iy !== except) { iy.value = qText(pts[i].y); iy.classList.remove("bad"); }
  });
}
document.getElementById("preset").addEventListener("change", e => {
  if (!e.target.value) return;
  e.target.value.split(";").forEach((pair, i) => {
    const [x, y] = pair.split(",").map(Number);
    pts[i] = { x: q(x), y: q(y) };
  });
  e.target.value = "";
  syncInputs(); update(); fitView();
});
["showCirc", "showIn"].forEach(id => document.getElementById(id).addEventListener("change", draw));

/* ================= Computation ================= */
function row(name, html) { return `<span class="name">${name}</span><div class="val">${html}</div>`; }
function na(name, msg) { return `<span class="name">${name}</span><div class="val na">${msg}</div>`; }

function compute() {
  const [A, B, C] = pts;
  const d2 = (P, R) => { const dx = R.x.sub(P.x), dy = R.y.sub(P.y); return dx.mul(dx).add(dy.mul(dy)); };
  const a2 = d2(B, C), b2 = d2(C, A), c2 = d2(A, B);
  const a = sSqrt(a2), b = sSqrt(b2), c = sSqrt(c2);

  let html = "";
  html += row("a = |BC|", fmtSurd(a) + approx(sNum(a)));
  html += row("b = |CA|", fmtSurd(b) + approx(sNum(b)));
  html += row("c = |AB|", fmtSurd(c) + approx(sNum(c)));
  document.getElementById("sides").innerHTML = html;

  const slope = (P, R) => { const dx = R.x.sub(P.x), dy = R.y.sub(P.y); return dx.isZero() ? null : dy.div(dx); };
  html = "";
  for (const [P, R, nm] of [[A, B, "AB"], [B, C, "BC"], [C, A, "CA"]]) {
    const m = slope(P, R);
    const same = P.x.sub(R.x).isZero() && P.y.sub(R.y).isZero();
    if (same) html += na(`m<sub>${nm}</sub>`, "points coincide");
    else if (m === null) html += na(`m<sub>${nm}</sub>`, "undefined (vertical)");
    else html += row(`m<sub>${nm}</sub>`, fmtQ(m) + approx(m.num()));
  }
  document.getElementById("slopes").innerHTML = html;

  const twiceSigned = B.x.sub(A.x).mul(C.y.sub(A.y)).sub(C.x.sub(A.x).mul(B.y.sub(A.y)));
  const K = twiceSigned.abs().div(q(2));
  const perim = sAdd(sAdd(a, b), c);

  html = row("Perimeter", fmtSurd(perim) + approx(sNum(perim)));
  html += row("Area", fmtQ(K) + approx(K.num()));
  const note = document.getElementById("note");
  note.className = "note";

  if (K.isZero()) {
    html += na("R", "none: points are collinear");
    html += na("r", "none: points are collinear");
    document.getElementById("measures").innerHTML = html;
    document.getElementById("centers").innerHTML = na("O", "—") + na("I", "—");
    note.className = "note warn";
    note.textContent = "The three points lie on one line, so they do not form a triangle.";
    geom = null;
    return;
  }

  // R = abc / (4K),  r = 2K / (a+b+c)
  const R = sScale(sMul(sMul(a, b), c), new Q(1n).div(K.mul(q(4))));
  const r = sScale(sInv(perim), K.mul(q(2)));
  html += row("Circumradius R", fmtSurd(R) + approx(sNum(R)));
  html += row("Inradius r", fmtSurd(r) + approx(sNum(r)));
  document.getElementById("measures").innerHTML = html;

  // Circumcenter (rational)
  const D = q(2).mul(A.x.mul(B.y.sub(C.y)).add(B.x.mul(C.y.sub(A.y))).add(C.x.mul(A.y.sub(B.y))));
  const sq = P => P.x.mul(P.x).add(P.y.mul(P.y));
  const Ox = sq(A).mul(B.y.sub(C.y)).add(sq(B).mul(C.y.sub(A.y))).add(sq(C).mul(A.y.sub(B.y))).div(D);
  const Oy = sq(A).mul(C.x.sub(B.x)).add(sq(B).mul(A.x.sub(C.x))).add(sq(C).mul(B.x.sub(A.x))).div(D);
  // Incenter = (aA + bB + cC)/(a+b+c)
  const ip = sInv(perim);
  const Ix = sMul(sAdd(sAdd(sScale(a, A.x), sScale(b, B.x)), sScale(c, C.x)), ip);
  const Iy = sMul(sAdd(sAdd(sScale(a, A.y), sScale(b, B.y)), sScale(c, C.y)), ip);
  html = row("Circumcenter O", fmtPoint(sQ(Ox), sQ(Oy)));
  html += row("Incenter I", fmtPoint(Ix, Iy));
  document.getElementById("centers").innerHTML = html;

  // Notes: right angle / obtuse
  const notes = [];
  const sides = { A: [b2, c2, a2], B: [c2, a2, b2], C: [a2, b2, c2] }; // [adj1, adj2, opposite]
  for (const v of NAMES) {
    const [p, s, o] = sides[v];
    const diff = p.add(s).sub(o);
    if (diff.isZero()) notes.push(`Right angle at ${v} (${v === "A" ? "b² + c² = a²" : v === "B" ? "c² + a² = b²" : "a² + b² = c²"}), so the circumcenter is the midpoint of the hypotenuse.`);
    else if (diff.n < 0n) notes.push(`Obtuse angle at ${v}, so the circumcenter lies outside the triangle.`);
  }
  note.textContent = notes.join(" ");

  geom = { O: [Ox.num(), Oy.num()], R: sNum(R), I: [sNum(Ix), sNum(Iy)], r: sNum(r) };
}

/* ================= Drawing ================= */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let W = 0, H = 0;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const toS = (x, y) => [W / 2 + (x - view.cx) * view.scale, H / 2 - (y - view.cy) * view.scale];
const toW = (sx, sy) => [view.cx + (sx - W / 2) / view.scale, view.cy - (sy - H / 2) / view.scale];

function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
new ResizeObserver(resize).observe(cv);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);

function niceStep() {
  const target = 90 / view.scale;           // world units for ~90px
  const p = Math.pow(10, Math.floor(Math.log10(target)));
  for (const m of [1, 2, 5, 10]) if (m * p >= target) return [m * p, m === 2 ? 4 : 5];
  return [10 * p, 5];
}
function fmtTick(v, step) {
  const dec = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
  const s = v.toFixed(dec);
  return s.startsWith("-") ? MINUS + s.slice(1) : s;
}

function draw() {
  if (!W) return;
  ctx.clearRect(0, 0, W, H);
  const [major, div] = niceStep(), minor = major / div;
  const [x0, y1] = toW(0, 0), [x1, y0] = toW(W, H);

  const lines = (step, color, width) => {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
    for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) { const sx = Math.round(toS(x, 0)[0]) + 0.5; ctx.moveTo(sx, 0); ctx.lineTo(sx, H); }
    for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) { const sy = Math.round(toS(0, y)[1]) + 0.5; ctx.moveTo(0, sy); ctx.lineTo(W, sy); }
    ctx.stroke();
  };
  lines(minor, css("--grid-minor"), 1);
  lines(major, css("--grid-major"), 1);

  // axes
  const [ax, ay] = toS(0, 0);
  ctx.strokeStyle = css("--axis"); ctx.lineWidth = 1.5; ctx.beginPath();
  ctx.moveTo(0, ay); ctx.lineTo(W, ay); ctx.moveTo(ax, 0); ctx.lineTo(ax, H); ctx.stroke();

  // tick labels
  ctx.fillStyle = css("--muted");
  ctx.font = '12px "Source Sans 3", system-ui, sans-serif';
  const ly = Math.min(Math.max(ay + 4, 4), H - 18);
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let x = Math.ceil(x0 / major) * major; x <= x1; x += major) {
    if (Math.abs(x) < major / 2) continue;
    ctx.fillText(fmtTick(x, major), toS(x, 0)[0], ly);
  }
  const lx = Math.min(Math.max(ax - 6, 30), W - 6);
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let y = Math.ceil(y0 / major) * major; y <= y1; y += major) {
    if (Math.abs(y) < major / 2) continue;
    ctx.fillText(fmtTick(y, major), lx, toS(0, y)[1]);
  }

  const S = pts.map(p => toS(p.x.num(), p.y.num()));
  // triangle
  ctx.beginPath(); ctx.moveTo(...S[0]); ctx.lineTo(...S[1]); ctx.lineTo(...S[2]); ctx.closePath();
  ctx.fillStyle = css("--tri-fill"); ctx.fill();
  ctx.strokeStyle = css("--ink"); ctx.lineWidth = 2; ctx.stroke();

  if (geom) {
    if (document.getElementById("showCirc").checked) {
      const [ox, oy] = toS(...geom.O);
      ctx.setLineDash([7, 6]); ctx.strokeStyle = css("--circum"); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ox, oy, geom.R * view.scale, 0, 2 * Math.PI); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = css("--circum"); ctx.beginPath(); ctx.arc(ox, oy, 3.5, 0, 2 * Math.PI); ctx.fill();
      ctx.font = 'italic 16px "EB Garamond", serif'; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
      ctx.fillText("O", ox + 6, oy - 3);
    }
    if (document.getElementById("showIn").checked) {
      const [ix, iy] = toS(...geom.I);
      ctx.strokeStyle = css("--incircle"); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ix, iy, geom.r * view.scale, 0, 2 * Math.PI); ctx.stroke();
      ctx.fillStyle = css("--incircle"); ctx.beginPath(); ctx.arc(ix, iy, 3.5, 0, 2 * Math.PI); ctx.fill();
      ctx.font = 'italic 16px "EB Garamond", serif'; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
      ctx.fillText("I", ix + 6, iy - 3);
    }
  }

  // vertices
  const cx = (S[0][0] + S[1][0] + S[2][0]) / 3, cy = (S[0][1] + S[1][1] + S[2][1]) / 3;
  S.forEach(([sx, sy], i) => {
    const col = css("--pt" + NAMES[i]);
    ctx.fillStyle = col; ctx.strokeStyle = css("--panel"); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, 7, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
    let dx = sx - cx, dy = sy - cy; const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    ctx.font = '600 20px "EB Garamond", serif'; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(NAMES[i], sx + dx * 20, sy + dy * 20);
    ctx.font = '13px "Source Sans 3", sans-serif'; ctx.fillStyle = css("--muted");
    ctx.fillText(`(${qText(pts[i].x)}, ${qText(pts[i].y)})`.replace(/-/g, MINUS), sx + dx * 20, sy + dy * 20 + 17);
  });
}

/* ================= Interaction ================= */
const pointers = new Map();
let drag = null;   // {type:'pt', i} or {type:'pan', ...} or {type:'pinch', ...}

function snapQ(v) {
  const den = Number(document.getElementById("snap").value);
  return q(Math.round(v * den), den);
}
function hitPoint(sx, sy) {
  let best = -1, bd = 18;
  pts.forEach((p, i) => { const [px, py] = toS(p.x.num(), p.y.num()); const d = Math.hypot(px - sx, py - sy); if (d < bd) { bd = d; best = i; } });
  return best;
}
function local(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, local(e));
  if (pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    drag = { type: "pinch", d: Math.hypot(p1[0] - p2[0], p1[1] - p2[1]), scale: view.scale, mid: toW((p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2) };
    return;
  }
  const [sx, sy] = local(e);
  const i = hitPoint(sx, sy);
  drag = i >= 0 ? { type: "pt", i } : { type: "pan", sx, sy, cx: view.cx, cy: view.cy };
  cv.classList.add("dragging");
});
cv.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) {
    const [sx, sy] = local(e);
    cv.style.cursor = hitPoint(sx, sy) >= 0 ? "pointer" : "";
    return;
  }
  pointers.set(e.pointerId, local(e));
  if (!drag) return;
  if (drag.type === "pinch" && pointers.size >= 2) {
    const [p1, p2] = [...pointers.values()];
    const d = Math.hypot(p1[0] - p2[0], p1[1] - p2[1]);
    view.scale = clampScale(drag.scale * d / drag.d);
    const mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
    view.cx = drag.mid[0] - (mx - W / 2) / view.scale;
    view.cy = drag.mid[1] + (my - H / 2) / view.scale;
    draw();
  } else if (drag.type === "pt") {
    const [wx, wy] = toW(...local(e));
    const nx = snapQ(wx), ny = snapQ(wy), p = pts[drag.i];
    if (!nx.sub(p.x).isZero() || !ny.sub(p.y).isZero()) { pts[drag.i] = { x: nx, y: ny }; syncInputs(); update(); }
  } else if (drag.type === "pan") {
    const [sx, sy] = local(e);
    view.cx = drag.cx - (sx - drag.sx) / view.scale;
    view.cy = drag.cy + (sy - drag.sy) / view.scale;
    draw();
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) { drag = null; cv.classList.remove("dragging"); }
  else if (drag && drag.type === "pinch") { drag = null; }
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);

const clampScale = s => Math.min(2000, Math.max(2, s));
function zoomAt(factor, sx = W / 2, sy = H / 2) {
  const [wx, wy] = toW(sx, sy);
  view.scale = clampScale(view.scale * factor);
  view.cx = wx - (sx - W / 2) / view.scale;
  view.cy = wy + (sy - H / 2) / view.scale;
  draw();
}
cv.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), ...local(e)); }, { passive: false });
document.getElementById("zin").onclick = () => zoomAt(1.25);
document.getElementById("zout").onclick = () => zoomAt(0.8);
document.getElementById("zfit").onclick = () => fitView();

function fitView() {
  if (!W) return;
  let xs = pts.map(p => p.x.num()), ys = pts.map(p => p.y.num());
  if (geom && document.getElementById("showCirc").checked) {
    xs.push(geom.O[0] - geom.R, geom.O[0] + geom.R); ys.push(geom.O[1] - geom.R, geom.O[1] + geom.R);
  }
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  view.cx = (minx + maxx) / 2; view.cy = (miny + maxy) / 2;
  const span = Math.max((maxx - minx) / (W - 80), (maxy - miny) / (H - 80), 1e-9);
  view.scale = clampScale(1 / span);
  draw();
}

function update() { compute(); draw(); }

syncInputs();
compute();
requestAnimationFrame(() => { resize(); fitView(); });
if (document.fonts) document.fonts.ready.then(draw);
</script>
</body>
</html>
